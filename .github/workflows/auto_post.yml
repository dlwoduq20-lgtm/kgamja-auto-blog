name: Daily Auto Post to WordPress

on:
  schedule:
    # 매일 한국 시간 09:05, 12:05, 17:05, 20:05 실행 (GitHub Actions 정각 트래픽 지연 방지 최적화)
    - cron: '5 0 * * *'   # 09:05 KST (00:05 UTC)
    - cron: '5 3 * * *'   # 12:05 KST (03:05 UTC)
    - cron: '5 8 * * *'   # 17:05 KST (08:05 UTC)
    - cron: '5 11 * * *'  # 20:05 KST (11:05 UTC)
  workflow_dispatch: # GitHub 웹 화면에서 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 워드프레스 자동 글 생성 및 포스팅 실행
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: |
          python main.py --next --status publish

      - name: 큐 진행 상태 저장 (Git Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add topics_queue.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update topics queue [skip ci]"
          git push
