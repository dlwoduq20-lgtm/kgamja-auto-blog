name: 24/7 Smart Auto Post to Google Blogger (4 Global Blogs)

on:
  schedule:
    # 한국 시각(KST) 09:00, 12:00, 17:00, 20:00 (UTC 00:00, 03:00, 08:00, 11:00)
    # 20분 주기(하루 72회) -> 하루 4회로 최적화하여 2,000분 무료 사용량 초과 완벽 방지
    - cron: '0 0,3,8,11 * * *'
  workflow_dispatch: # 웹에서 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 24시간 스마트 스케줄러 실행 (9시, 12시, 17시, 20시 자동 감지)
        env:
          BLOGGER_CREDENTIALS: ${{ secrets.BLOGGER_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONIOENCODING: "utf-8"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python smart_scheduler_runner.py

      - name: 진행 상태 저장 및 GitHub 동기화 (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add topics_queue*.json published_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update queue and history [skip ci]"
          git pull --rebase origin main || true
          git push
